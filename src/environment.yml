name: lambda_tools
# Core environment for selection, subsampling, BLAST filtering, dereplication,
# merging, and control generation.
#
# Separate tools run in their own environments (created independently):
#   - bakta   (bacterial annotation, step 08)        -> env: bakta_env
#   - genomad (prophage detection/masking, planned)  -> env: genomad_env
#   - vclust  (phage clustering, upstream of step 01)
#
# TODO (reproducibility): pin exact versions actually used for the release,
# including blast, vclust, pharokka, bakta, checkm2, and genomad.
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pandas>=1.3.0
  - biopython>=1.79
  - matplotlib>=3.4.0
  - numpy>=1.20.0
  - blast>=2.13.0      # makeblastdb / blastn (prophage filtering + dereplication)
